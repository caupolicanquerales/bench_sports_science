server:
  port: ${PORT:8084}
  shutdown: graceful
spring:
  application:
    name: bench_sports_science
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  batch:
    job:
      enabled: false
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8083/oauth2/jwks # Point to your Auth Server JWK URI
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables on startup
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
        generate_statistics: false
        
minio:
  url: http://localhost:9000      # API port mapped in minIO.yml[cite: 10]
  access-key: minioadmin          # Match MINIO_ROOT_USER in minIO.yml[cite: 10]
  secret-key: minioadmin          # Match MINIO_ROOT_PASSWORD in minIO.yml[cite: 10]
  bucket-name: garmin-csv-bucket  # Target bucket for storage

---
# ------------------------------------------------------------------
# Local Environment Profile
# ------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/timescale_benchauthDB}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

---
