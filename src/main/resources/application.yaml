server:
  port: ${PORT:8084}
  shutdown: graceful
spring:
  application:
    name: bench_sports_science
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables on startup
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
        generate_statistics: false

---
# ------------------------------------------------------------------
# Local Environment Profile
# ------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/timescale_benchauthDB}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
